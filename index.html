<script>
'use strict';
/* ===== Pixel-Renderer: logische Koordinaten 384x216, gezeichnet mit K-facher Auflösung ===== */
const W = 384, H = 216, K = 3, E = 1 / K; // E = dünne Linie (1 Gerätepixel)
let G = null;
function setG(ctx) { G = ctx; ctx.imageSmoothingEnabled = false; }
function mk(w, h) { const c = document.createElement('canvas'); c.width = Math.round(w * K); c.height = Math.round(h * K); return c; }
let _s = 1;
function seed(n) { _s = n >>> 0; }
function rnd() { _s = (_s * 1664525 + 1013904223) >>> 0; return _s / 4294967296; }
/* Rechteck (logische Koordinaten, auch Bruchteile) */
function R(x, y, w, h, c) {
  G.fillStyle = c; const x0 = Math.round(x * K), y0 = Math.round(y * K);
  const w0 = Math.round((x + w) * K) - x0, h0 = Math.round((y + h) * K) - y0;

function fir(cx, yTop, yBot, wBase, c1, c2, c3) { // Nadelbaum-Etage (oben schmal, unten breit)

  for (let j = 0; j < Hh; j++) {
    const t = j / Hh, jag = Math.sin(j * 0.9) * 2.2 + Math.sin(j * 2.3) * 1.2;
    const w = wBase * K * (0.12 + 0.88 * t) + jag * (0.3 + t), y = T + j;
    G.fillStyle = c1; G.fillRect(Math.round(X - w), Math.round(y), Math.round(w * 2), 1);
    G.fillStyle = c3; G.fillRect(Math.round(X + w * 0.25), Math.round(y), Math.round(w * 0.75), 1);
    if (j % 7 < 2) { G.fillStyle = c2; G.fillRect(Math.round(X - w * 0.9), Math.round(y), Math.round(w * 0.9), 1); }
  }
  for (let i = -wBase; i <= wBase; i += 3) { const len = 3 + ((i * 7) & 3); G.fillStyle = i > 0 ? c3 : c1; G.fillRect(Math.round(X + i * K - 3), Math.round(B - 2), 6, len * 2); G.fillStyle = c2; G.fillRect(Math.round(X + i * K - 3), Math.round(B - 2), 2, len * 2); }
  Dd(X - wBase * K, B, wBase * K * 2, 10, '#06140c', 9, 2);
}

/* Rohrleitung: Luft vom Kompressor (links) zur Kiste (rechts) leiten */
function puzPipes() {
  return new Promise(res => {
    const p = panel('Die Luftleitung');
    p.appendChild(el('p', null, 'Tramnitz hat die Luftzufuhr abgeklemmt. Drehe die Rohrstücke (Tippen), bis die Luft vom Kompressor links bis zur Kiste rechts strömt.'));
    // Maske: N=1 E=2 S=4 W=8. Typ S = gerade (O+W), C = Ecke (N+O)
    const T = [['C', 'C', 'C', 'S'], ['S', 'C', 'C', 'S'], ['C', 'S', 'C', 'S']].map(r => r.map(t => ({ t })));
    const rot0 = [[1, 0, 1, 2], [1, 0, 2, 1], [2, 1, 3, 0]]; // Startdrehung
    const cells = []; const grid = el('div', 'pipes'); const msg = el('div', 'msg');
    const mask = c => { const base = c.t === 'S' ? [2, 8] : [1, 2]; const dirs = [1, 2, 4, 8]; return base.reduce((m, d) => m | dirs[(dirs.indexOf(d) + c.r) % 4], 0); };
    const flow = () => { // Weg ab (Zeile 1, Spalte 0) von links
      let r = 1, c = 0, from = 8; const seen = [];
      for (let n = 0; n < 20; n++) {
        if (r < 0 || r > 2 || c < 0 || c > 3) return { ok: c > 3 && r === 1, seen };
        const m = mask(T[r][c]); if (!(m & from)) return { ok: false, seen }; seen.push([r, c]);
        const out = m & ~from; if (out === 1) { r--; from = 4; } else if (out === 2) { c++; from = 8; } else if (out === 4) { r++; from = 1; } else { c--; from = 2; }
      }
      return { ok: false, seen };
    };
    const draw = (cv, c, lit) => {
      const g = cv.getContext('2d'); setG(g); g.clearRect(0, 0, 64, 64); const pc = lit ? '#7fd6ff' : '#8a9098', pe = lit ? '#2a8abf' : '#4a4e56';
      const seg = (x, y, w, h) => { g.fillStyle = pe; g.fillRect(x - 1, y - 1, w + 2, h + 2); g.fillStyle = pc; g.fillRect(x, y, w, h); };
      const m = c.t === 'S' ? [2, 8] : [1, 2]; // Zeichnen in Grundlage, Drehung per CSS
      g.fillStyle = '#20222a'; g.fillRect(0, 0, 64, 64);
      m.forEach(d => { if (d === 1) seg(24, 0, 16, 36); if (d === 2) seg(28, 24, 36, 16); if (d === 8) seg(0, 24, 36, 16); });
      g.fillStyle = pe; g.fillRect(26, 26, 12, 12); g.fillStyle = pc; g.fillRect(28, 28, 8, 8);
    };
    let finished = false;
    const refresh = () => {
      const f = flow(); const lit = new Set(f.seen.map(s => s.join(',')));
      cells.forEach(o => { o.cv.style.transform = 'rotate(' + o.c.r * 90 + 'deg)'; draw(o.cv, o.c, lit.has(o.r + ',' + o.q)); });
      if (f.ok && !finished) { finished = true; msg.textContent = 'Es zischt. Die Luft strömt in die Kiste!'; setTimeout(() => { ovClose(); res(); }, 1200); }
    };
    T.forEach((row, r) => row.forEach((c, q) => { c.r = rot0[r][q]; const cv = document.createElement('canvas'); cv.width = 64; cv.height = 64; cells.push({ cv, c, r, q }); cv.addEventListener('click', () => { if (finished) return; c.r = (c.r + 1) % 4; refresh(); }); grid.appendChild(cv); }));
    const io = el('div', 'row c'); io.innerHTML = '<span class="small">Kompressor ▶ (linke Seite, mittlere Zeile) … ▶ Kiste (rechts, mittlere Zeile)</span>';
    p.appendChild(grid); p.appendChild(io); p.appendChild(msg); ovOpen(p); refresh();
    if (flow().ok) { cells[1].c.r = (cells[1].c.r + 1) % 4; refresh(); }
  });
}
